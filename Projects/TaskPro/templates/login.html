{% extends 'base.html' %}
{% block title %}Login - TaskPro{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card auth-card shadow-sm border-0">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="avatar bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-box-arrow-in-right fs-3"></i>
          </div>
          <h3 class="fw-bold text-dark">Welcome back</h3>
          <p class="text-muted small">Enter your credentials to access your tasks</p>
        </div>

        <div id="login-message" class="alert d-none"></div>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" name="username" placeholder="Enter username" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" name="password" placeholder="Enter password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">Sign In</button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
          <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register_page' %}" class="text-primary text-decoration-none fw-semibold">Create account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = e.target;
  const data = {username: form.username.value, password: form.password.value};
  const msgDiv = document.getElementById('login-message');
  
  try {
    const resp = await fetch('{% url "token_obtain_pair" %}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    if (resp.ok){
      const tokens = await resp.json();
      localStorage.setItem('access_token', tokens.access);
      localStorage.setItem('refresh_token', tokens.refresh);
      msgDiv.className = 'alert alert-success py-2';
      msgDiv.textContent = 'Login successful. Redirecting...';
      msgDiv.classList.remove('d-none');
      setTimeout(()=>{window.location.href = '{% url "dashboard" %}';}, 800);
    } else {
      const err = await resp.json();
      msgDiv.className = 'alert alert-danger py-2';
      msgDiv.textContent = err.detail || 'Invalid username or password.';
      msgDiv.classList.remove('d-none');
    }
  } catch(err) {
    msgDiv.className = 'alert alert-danger py-2';
    msgDiv.textContent = 'Network or server error occurred.';
    msgDiv.classList.remove('d-none');
  }
});
</script>
{% endblock %}
