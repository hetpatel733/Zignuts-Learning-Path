{% extends 'base.html' %}
{% load static %}
{% block title %}Dashboard - TaskPro{% endblock %}
{% block content %}
<div class="row mb-4 align-items-center">
  <div class="col-12 col-md-6 mb-3 mb-md-0">
    <h2 class="fw-bold mb-1 text-dark">Tasks Dashboard</h2>
    <p class="text-muted small mb-0">Organize, track, and complete your tasks effectively</p>
  </div>
  <div class="col-12 col-md-6 text-md-end">
    <button class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-semibold d-inline-flex align-items-center gap-2" data-bs-toggle="collapse" data-bs-target="#createTaskForm" aria-expanded="false">
      <i class="bi bi-plus-lg"></i>
      <span>New Task</span>
    </button>
  </div>
</div>

<div class="collapse mb-4" id="createTaskForm">
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-pencil-square text-primary me-2"></i>Create New Task</h5>
        <button type="button" class="btn-close" data-bs-toggle="collapse" data-bs-target="#createTaskForm" aria-label="Close"></button>
      </div>
      <form id="task-create-form">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label small fw-semibold text-secondary">Title</label>
            <input type="text" class="form-control" name="title" placeholder="e.g. Prepare project presentation" required>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small fw-semibold text-secondary">Due Date</label>
            <input type="date" class="form-control" name="due_date" required>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label small fw-semibold text-secondary">Priority</label>
            <select class="form-select" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label small fw-semibold text-secondary">Description</label>
            <textarea class="form-control" name="description" rows="3" placeholder="Add more details about this task..."></textarea>
          </div>
          <div class="col-12 text-end pt-2">
            <button type="button" class="btn btn-light me-2 rounded-pill px-3" data-bs-toggle="collapse" data-bs-target="#createTaskForm">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-pill px-4 shadow-sm">Save Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Filters Card -->
<div class="card shadow-sm border-0 rounded-4 mb-4">
  <div class="card-body p-3">
    <div class="row g-2 align-items-center">
      <div class="col-12 col-md-5">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
          <input type="text" id="search-input" class="form-control border-start-0 ps-0" placeholder="Search tasks by title...">
        </div>
      </div>
      <div class="col-6 col-md-3">
        <select id="status-filter" class="form-select">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="priority-filter" class="form-select">
          <option value="">All Priorities</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>
      <div class="col-12 col-md-2">
        <button id="apply-filters" class="btn btn-outline-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-1">
          <i class="bi bi-funnel"></i> Filter
        </button>
      </div>
    </div>
  </div>
</div>

<div id="task-list" class="row"></div>
{% endblock %}
