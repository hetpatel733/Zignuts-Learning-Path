{% extends 'base.html' %}
{% block title %}Register - TaskPro{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
    <div class="card auth-card shadow-sm border-0">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="avatar bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
            <i class="bi bi-person-plus fs-3"></i>
          </div>
          <h3 class="fw-bold text-dark">Create Account</h3>
          <p class="text-muted small">Sign up to manage your tasks efficiently</p>
        </div>

        <div id="register-message" class="alert d-none"></div>

        <form id="register-form">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" name="username" placeholder="Choose a username" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" name="password" placeholder="At least 8 characters" required minlength="8">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock-fill"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" name="password2" placeholder="Re-enter password" required minlength="8">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm">Get Started</button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
          <p class="text-muted small mb-0">Already have an account? <a href="{% url 'login_page' %}" class="text-primary text-decoration-none fw-semibold">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = e.target;
  const msgDiv = document.getElementById('register-message');

  if (form.password.value !== form.password2.value) {
    msgDiv.className = 'alert alert-danger py-2';
    msgDiv.textContent = 'Passwords do not match.';
    msgDiv.classList.remove('d-none');
    return;
  }

  const data = {
    username: form.username.value,
    password: form.password.value,
    password2: form.password2.value,
  };

  try {
    const resp = await fetch('{% url "register" %}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });

    if (resp.ok){
      msgDiv.className = 'alert alert-success py-2';
      msgDiv.textContent = 'Account created successfully! Redirecting to login...';
      msgDiv.classList.remove('d-none');
      setTimeout(()=>{window.location.href = '{% url "login_page" %}';}, 1200);
    } else {
      const err = await resp.json();
      msgDiv.className = 'alert alert-danger py-2';
      let errorMsg = '';
      if (typeof err === 'object') {
        for (const [key, value] of Object.entries(err)) {
          errorMsg += `${key}: ${Array.isArray(value) ? value.join(', ') : value} `;
        }
      } else {
        errorMsg = err.detail || JSON.stringify(err);
      }
      msgDiv.textContent = errorMsg;
      msgDiv.classList.remove('d-none');
    }
  } catch(err) {
    msgDiv.className = 'alert alert-danger py-2';
    msgDiv.textContent = 'Network or server error occurred.';
    msgDiv.classList.remove('d-none');
  }
});
</script>
{% endblock %}
