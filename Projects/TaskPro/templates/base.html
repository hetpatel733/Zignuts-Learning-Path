{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TaskPro{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-2">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
      <i class="bi bi-check2-square text-primary fs-4"></i>
      <span>Task<span class="text-primary">Pro</span></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2 py-2 py-lg-0" id="nav-auth-links">
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'dashboard' %}">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="{% url 'login_page' %}" id="nav-login">Login</a></li>
        <li class="nav-item"><a class="btn btn-primary btn-sm px-3 rounded-pill text-white" href="{% url 'register_page' %}" id="nav-register">Register</a></li>
        <li class="nav-item d-none" id="nav-logout-item">
          <button class="btn btn-outline-light btn-sm px-3 rounded-pill" id="nav-logout-btn">Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="py-4">
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="{% static 'js/main.js' %}"></script>
<script>
  // Dynamic navbar state based on token
  (function() {
    const token = localStorage.getItem('access_token');
    const navLogin = document.getElementById('nav-login');
    const navRegister = document.getElementById('nav-register');
    const navLogoutItem = document.getElementById('nav-logout-item');
    const navLogoutBtn = document.getElementById('nav-logout-btn');

    if (token) {
      if (navLogin) navLogin.parentElement.classList.add('d-none');
      if (navRegister) navRegister.parentElement.classList.add('d-none');
      if (navLogoutItem) navLogoutItem.classList.remove('d-none');
    }

    if (navLogoutBtn) {
      navLogoutBtn.addEventListener('click', () => {
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        window.location.href = '{% url "login_page" %}';
      });
    }
  })();
</script>
